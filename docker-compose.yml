services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - api
